name: Austral headlines

# Manual only: Actions → Austral headlines → Run workflow.
# The result is shown on the run's summary page and saved as an artifact.
# Nothing is sent anywhere (always --dry-run).
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back how many hours?"
        type: choice
        options: ["2", "3", "5", "8", "12", "24"]
        default: "3"
      web_search:
        description: "Also use Claude web search (~US$0.80/run extra). Off = RSS only (~US$0.03/run)"
        type: boolean
        default: false

  # To bring back automatic runs (Montevideo = UTC-3, Mon-Fri 08/10/12/15/18 h),
  # uncomment this block:
  # schedule:
  #   - cron: "0 11 * * 1-5"
  #   - cron: "0 13 * * 1-5"
  #   - cron: "0 15 * * 1-5"
  #   - cron: "0 18 * * 1-5"
  #   - cron: "0 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: austral-headlines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          HOURS: ${{ inputs.hours }}
          WEB_SEARCH: ${{ inputs.web_search }}
        run: |
          ARGS="--dry-run --hours ${HOURS:-3}"
          case "${{ github.event.schedule }}" in
            "0 11 * * 1-5") ARGS="--dry-run --slot 08:00" ;;
            "0 13 * * 1-5") ARGS="--dry-run --slot 10:00" ;;
            "0 15 * * 1-5") ARGS="--dry-run --slot 12:00" ;;
            "0 18 * * 1-5") ARGS="--dry-run --slot 15:00" ;;
            "0 21 * * 1-5") ARGS="--dry-run --slot 18:00" ;;
          esac
          if [ "$WEB_SEARCH" != "true" ]; then ARGS="$ARGS --no-search"; fi
          python main.py $ARGS
      - name: Show headlines on the run page
        if: always()
        run: |
          f=$(ls -t output/*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            { echo "## Austral headlines"; echo; sed 's/$/  /' "$f"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No output file (see the 'Run digest' log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headlines-${{ github.run_id }}
          path: output/*.md
          if-no-files-found: ignore
          retention-days: 90
