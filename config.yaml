# Austral Research – breaking-news headlines configuration.
# Edit topics, tickers and sources here. Secrets go in .env, never here.

timezone: America/Montevideo

# Scheduled runs (local time) and how many hours back each one looks.
runs:
  "08:00": 5     # "last 4-5 h" -> 5 h
  "10:00": 2
  "12:00": 2
  "15:00": 3
  "18:00": 3

# A scheduled (non --now) invocation only runs if it is within this many
# minutes of a slot; otherwise it exits without doing anything.
slot_tolerance_minutes: 60
# Allow published timestamps up to this many minutes in the "future"
# (clock skew between our machine and the publisher).
future_skew_minutes: 5

max_headlines: 15
max_candidates_for_llm: 150

http:
  timeout_seconds: 12
  max_page_bytes: 800000
  user_agent: "Mozilla/5.0 (compatible; AustralHeadlinesBot/1.0; personal news digest)"

search:
  enabled: true
  max_uses_per_query: 5
  tool_type: web_search_20260209   # use web_search_20250305 for older models
  # Search results are only accepted after the page metadata confirms a timestamp.
  max_page_checks: 60

topics:
  - name: Energy & critical minerals
    query: "oil, natural gas, LNG, OPEC, lithium, rare earths, uranium, critical minerals supply and policy news"
  - name: Metals & commodities
    query: "gold, silver, copper, aluminum market drivers (central banks, supply, mine disruptions, tariffs) and agricultural commodities (soybeans, corn, wheat, coffee, sugar) news"
  - name: Macro & Fed
    query: "Federal Reserve, interest rates, US inflation CPI PCE, jobs report, PMI, GDP, Treasury yields, central bank statements (ECB, BoJ, BoE, PBoC)"
  - name: LatAm (Argentina, Brazil, Chile)
    query: "Argentina, Brazil and Chile economic policy, central bank (BCRA, Banco Central do Brasil, Banco Central de Chile), inflation, FX, bonds, markets, macro data"
  - name: Supply chains & geopolitics
    query: "tariffs, sanctions, trade deals, shipping and logistics disruptions, export controls, wars and conflicts affecting markets"

watchlist:
  - {ticker: FCX,  name: "Freeport-McMoRan"}
  - {ticker: SCCO, name: "Southern Copper"}
  - {ticker: AEM,  name: "Agnico Eagle Mines"}
  - {ticker: NEM,  name: "Newmont"}
  - {ticker: B,    name: "Barrick Mining"}
  - {ticker: VALE, name: "Vale"}
  - {ticker: PBR,  name: "Petrobras"}
  - {ticker: YPF,  name: "YPF"}
  - {ticker: PAM,  name: "Pampa Energía"}
  - {ticker: VIST, name: "Vista Energy"}

# Investing.com items are kept only if they name one of these banks.
investing_banks:
  - Morgan Stanley
  - Goldman Sachs
  - JPMorgan
  - J.P. Morgan
  - BofA
  - Bank of America
  - Barclays
  - Citi
  - Citigroup
  - UBS
  - Deutsche Bank
  - HSBC
  - BNP Paribas
  - Wells Fargo
  - Jefferies
  - RBC
  - BMO
  - Scotiabank
  - Macquarie
  - Bernstein
  - Itaú BBA
  - BTG Pactual
  - Santander
  - Credit Suisse
  - Societe Generale
  - Commerzbank
  - Natixis
  - Standard Chartered

# Allowed sources. ONLY these domains are accepted (subdomains included).
# priority: lower = better primary source when several outlets cover the same story.
# naive_tz: timezone assumed for timestamps without offset; omit to discard them.
sources:
